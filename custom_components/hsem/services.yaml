# HSEM Service definitions
# Schema validation for all service calls.

force_recalculation:
  name: Force recalculation
  description: >-
    Force the HSEM coordinator to run a full recalculation cycle immediately.
    All entity states are re-read and the planner is re-run. Useful for
    testing or when you need the most up-to-date recommendation without
    waiting for the next scheduled update.
  fields: {}

set_temporary_override:
  name: Set temporary override
  description: >-
    Temporarily override the automatic planner by forcing a specific working
    mode. While the override is active the planner output is bypassed and the
    chosen mode is sent directly to the inverter. Set the working mode to
    "auto" via the clear_override service to resume normal planner control.
  fields:
    working_mode:
      required: true
      selector:
        select:
          options:
            - "batteries_charge_grid"
            - "batteries_charge_solar"
            - "batteries_discharge_mode"
            - "batteries_discharge_window_mode"
            - "batteries_wait_mode"
            - "ev_smart_charging"
            - "force_batteries_discharge"
            - "force_export"
      description: "The working mode to force. Must be one of the supported override modes."
    duration_minutes:
      required: false
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: "minutes"
          mode: box
      description: >-
        Optional duration in minutes after which the override automatically
        expires and the planner resumes control. When omitted, the override
        persists until explicitly cleared via the clear_override service.
        Maximum is 1440 minutes (24 hours).

clear_override:
  name: Clear override
  description: >-
    Clear any active temporary working-mode override and return to automatic
    planner control. Has no effect when no override is currently active.
  fields: {}

export_diagnostics:
  name: Export diagnostics
  description: >-
    Export a structured diagnostics dump for the HSEM integration. The
    response contains the most recent planner input, planner output, hardware
    write status, and integration version — with all entity IDs redacted for
    safe sharing. Useful for debugging and issue reports. Response keys:
    hsem_version, dump_timestamp, planner_input, planner_output, apply_result.
    With write_file the dump is also written to <config>/hsem_debug/ and a
    notification gives the path and a link to a new GitHub issue prefilled
    with the HSEM and Home Assistant versions only.
  fields:
    write_file:
      required: false
      default: false
      selector:
        boolean:
      description: >-
        Also write the redacted dump to <config>/hsem_debug/ and create a
        notification with the file path and a prefilled issue link. The
        response then also holds debug_file.

export_data:
  name: Export data
  description: >-
    Back up what HSEM has learned to one JSON file under
    <config>/hsem_backups/: the prediction, financial, savings, daily and
    performance history, the solar forecast correction and the configuration.
    Entity IDs, secrets and certificate paths are redacted; certificates and
    keys are never included. Response key: backup_path.
  fields: {}

import_data:
  name: Import data
  description: >-
    Replace HSEM's learned data with a backup from <config>/hsem_backups/. The
    file is validated first: an unknown format or a backup from a newer HSEM is
    rejected and nothing changes. The current data is saved as
    hsem_backup_<time>_before_import.json, then the history is replaced and
    HSEM reloads. Response keys: imported_from, before_import_path,
    history_files_restored, solar_corrector_restored, configuration_restored,
    configuration_keys_skipped.
  fields:
    filename:
      required: true
      example: hsem_backup_20261120_143000.json
      selector:
        text:
      description: >-
        Name of the backup file in <config>/hsem_backups/, without a path.
    restore_configuration:
      required: false
      default: false
      selector:
        boolean:
      description: >-
        Also restore the configuration options from the backup. Redacted
        values (entity IDs, certificate paths) cannot be restored and keep
        their current value.

ocpp_debug_start_charging:
  name: OCPP debug start charging
  description: >-
    Diagnostics-only: manually send RemoteStartTransaction and
    SetChargingProfile to the currently connected OCPP charger, bypassing the
    anti-flap start window entirely. Use this to check whether the charger
    accepts a start command at all when the normal planner-driven path
    doesn't seem to start it. The planner's own target still applies on the
    next update cycle and may immediately stop the charger again if the plan
    calls for zero power.
  fields:
    charger:
      required: false
      default: "primary"
      selector:
        select:
          options:
            - "primary"
            - "second"
      description: >-
        Which EV's embedded OCPP server to target. "second" only applies
        when the second EV's OCPP server is configured and enabled.
    max_current_a:
      required: false
      default: 16
      selector:
        number:
          min: 6
          max: 32
          unit_of_measurement: "A"
          mode: box
      description: "Maximum charging current to request, in amperes."

ocpp_debug_stop_charging:
  name: OCPP debug stop charging
  description: >-
    Diagnostics-only: manually send RemoteStopTransaction to the currently
    connected OCPP charger, bypassing the anti-flap stop window entirely. Use
    this to check whether the charger accepts a stop command at all when the
    normal planner-driven path doesn't seem to stop it.
  fields:
    charger:
      required: false
      default: "primary"
      selector:
        select:
          options:
            - "primary"
            - "second"
      description: >-
        Which EV's embedded OCPP server to target. "second" only applies
        when the second EV's OCPP server is configured and enabled.

ocpp_debug_diagnostics:
  name: OCPP debug diagnostics
  description: >-
    Diagnostics-only: ask the connected OCPP charger for its own
    configuration (GetConfiguration) and for the charging limit it has
    actually computed from the profiles installed on the connector
    (GetCompositeSchedule). Use this when the charger accepts every command
    but still delivers no power — the replies show whether it supports
    smart charging at all, whether it expects amps or watts, and what limit
    it is really operating under. The answers are written to the HSEM log
    as they arrive.
  fields:
    charger:
      required: false
      default: "primary"
      selector:
        select:
          options:
            - "primary"
            - "second"
      description: >-
        Which EV's embedded OCPP server to target. "second" only applies
        when the second EV's OCPP server is configured and enabled.

ocpp_debug_set_current:
  name: OCPP debug set current
  description: >-
    Diagnostics-only: send a charging profile at the given current and
    nothing else - no remote start, no vendor force-state write. That
    isolation is the point: it answers whether the charger honours charging
    profiles at all, which no other action can, because they all change
    more than one thing at once. Use 0 to test the generic "draw nothing"
    stop. Note a value above the charger's own Station-MaxCurrent is
    accepted but cannot raise the limit, so it will look like nothing
    happened.
  fields:
    charger:
      required: false
      default: "primary"
      selector:
        select:
          options:
            - "primary"
            - "second"
      description: >-
        Which EV's embedded OCPP server to target. "second" only applies
        when the second EV's OCPP server is configured and enabled.
    current_a:
      required: true
      selector:
        number:
          min: 0
          max: 32
          unit_of_measurement: "A"
          mode: box
      description: >-
        Current limit to request. 0 means "draw nothing" (the generic OCPP
        stop); otherwise 6-32 A, since no charger delivers below its
        MinChargingCurrent.

ocpp_debug_set_availability:
  name: OCPP debug set availability
  description: >-
    Diagnostics-only: set the charger's connector Operative or Inoperative
    (OCPP ChangeAvailability). This is the standard way a central system
    takes a connector into or out of service. Note that "Inoperative" maps
    to connector status "Unavailable", which is not the same as
    "SuspendedEVSE" — a charger that is already Operative but locally
    refusing to deliver power will accept this and change nothing, which
    itself rules out availability as the cause.
  fields:
    charger:
      required: false
      default: "primary"
      selector:
        select:
          options:
            - "primary"
            - "second"
      description: >-
        Which EV's embedded OCPP server to target. "second" only applies
        when the second EV's OCPP server is configured and enabled.
    operative:
      required: false
      default: true
      selector:
        boolean:
      description: "True for Operative (in service), false for Inoperative."
    connector_id:
      required: false
      default: 1
      selector:
        number:
          min: 0
          max: 8
          mode: box
      description: >-
        Connector to change. 0 addresses the whole charge point rather
        than a single connector.

ocpp_debug_set_configuration:
  name: OCPP debug set configuration
  description: >-
    Diagnostics-only: write a single OCPP configuration key on the charger
    (OCPP ChangeConfiguration). Use the OCPP debug diagnostics service
    first to list the keys your charger actually exposes — including any
    vendor-specific ones — then set the relevant key here. The charger's
    reply (Accepted, Rejected, NotSupported, or RebootRequired) is written
    to the HSEM log.
  fields:
    charger:
      required: false
      default: "primary"
      selector:
        select:
          options:
            - "primary"
            - "second"
      description: >-
        Which EV's embedded OCPP server to target. "second" only applies
        when the second EV's OCPP server is configured and enabled.
    key:
      required: true
      selector:
        text:
      description: "Configuration key name, exactly as the charger reports it."
    value:
      required: true
      selector:
        text:
      description: "New value. OCPP 1.6 carries all configuration values as strings."

ocpp_generate_client_certificate:
  name: OCPP generate client certificate
  description: >-
    Sign a client key and certificate for one charge point with the CA HSEM
    generates for its OCPP server, for chargers that need a certificate
    uploaded before they can use mutual TLS. The files are written to the
    clients folder next to the CA (/ssl/hsem/ocpp/clients, or
    <config>/ssl/hsem/ocpp/clients when /ssl does not exist). Response keys:
    certificate_path, key_path, ca_certificate_path. Key contents are never
    returned.
  fields:
    cpid:
      required: true
      selector:
        text:
      description: >-
        Charge point identity the charger connects with (the last part of its
        backend URL path). Becomes the certificate's common name (CN). Letters,
        digits, ".", "_" and "-" only.
    replace:
      required: false
      default: false
      selector:
        boolean:
      description: >-
        Overwrite an existing certificate and key for this charge point.

create_dashboard:
  name: Create dashboard
  description: >-
    Create or update the bundled HSEM Lovelace dashboard. The dashboard YAML
    is copied to <config>/hsem_dashboard.yaml (or the optional
    dashboard_path override) and a storage-mode Lovelace dashboard is
    registered in Home Assistant so it appears in the sidebar. Response keys:
    dashboard_path, dashboard_url.
  fields:
    dashboard_path:
      required: false
      selector:
        text:
      description: >-
        Optional absolute file path where the dashboard YAML should be written.
        Must resolve inside the Home Assistant config directory. When omitted,
        the file is written to <config>/hsem_dashboard.yaml.
