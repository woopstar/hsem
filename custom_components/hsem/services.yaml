# HSEM Service definitions
# Schema validation for all service calls.

force_recalculation:
  name: Force recalculation
  description: >-
    Force the HSEM coordinator to run a full recalculation cycle immediately.
    All entity states are re-read and the planner is re-run. Useful for
    testing or when you need the most up-to-date recommendation without
    waiting for the next scheduled update.
  fields: {}

set_temporary_override:
  name: Set temporary override
  description: >-
    Temporarily override the automatic planner by forcing a specific working
    mode. While the override is active the planner output is bypassed and the
    chosen mode is sent directly to the inverter. Set the working mode to
    "auto" via the clear_override service to resume normal planner control.
  fields:
    working_mode:
      required: true
      selector:
        select:
          options:
            - "batteries_charge_grid"
            - "batteries_charge_solar"
            - "batteries_discharge_mode"
            - "batteries_wait_mode"
            - "ev_smart_charging"
            - "force_batteries_discharge"
            - "force_export"
      description: "The working mode to force. Must be one of the supported override modes."
    duration_minutes:
      required: false
      selector:
        number:
          min: 1
          max: 1440
          unit_of_measurement: "minutes"
          mode: box
      description: >-
        Optional duration in minutes after which the override automatically
        expires and the planner resumes control. When omitted, the override
        persists until explicitly cleared via the clear_override service.
        Maximum is 1440 minutes (24 hours).

clear_override:
  name: Clear override
  description: >-
    Clear any active temporary working-mode override and return to automatic
    planner control. Has no effect when no override is currently active.
  fields: {}

export_diagnostics:
  name: Export diagnostics
  description: >-
    Export a structured diagnostics dump for the HSEM integration. The
    response contains the most recent planner input, planner output, hardware
    write status, and integration version — with all entity IDs redacted for
    safe sharing. Useful for debugging and issue reports. Response keys:
    hsem_version, dump_timestamp, planner_input, planner_output, apply_result.
  fields: {}

ocpp_debug_start_charging:
  name: OCPP debug start charging
  description: >-
    Diagnostics-only: manually send RemoteStartTransaction and
    SetChargingProfile to the currently connected OCPP charger, bypassing the
    anti-flap start window entirely. Use this to check whether the charger
    accepts a start command at all when the normal planner-driven path
    doesn't seem to start it. The planner's own target still applies on the
    next update cycle and may immediately stop the charger again if the plan
    calls for zero power.
  fields:
    charger:
      required: false
      default: "primary"
      selector:
        select:
          options:
            - "primary"
            - "second"
      description: >-
        Which EV's embedded OCPP server to target. "second" only applies
        when the second EV's OCPP server is configured and enabled.
    max_current_a:
      required: false
      default: 16
      selector:
        number:
          min: 6
          max: 32
          unit_of_measurement: "A"
          mode: box
      description: "Maximum charging current to request, in amperes."

ocpp_debug_stop_charging:
  name: OCPP debug stop charging
  description: >-
    Diagnostics-only: manually send RemoteStopTransaction to the currently
    connected OCPP charger, bypassing the anti-flap stop window entirely. Use
    this to check whether the charger accepts a stop command at all when the
    normal planner-driven path doesn't seem to stop it.
  fields:
    charger:
      required: false
      default: "primary"
      selector:
        select:
          options:
            - "primary"
            - "second"
      description: >-
        Which EV's embedded OCPP server to target. "second" only applies
        when the second EV's OCPP server is configured and enabled.

create_dashboard:
  name: Create dashboard
  description: >-
    Create or update the bundled HSEM Lovelace dashboard. The dashboard YAML
    is copied to <config>/hsem_dashboard.yaml (or the optional
    dashboard_path override) and a storage-mode Lovelace dashboard is
    registered in Home Assistant so it appears in the sidebar. Response keys:
    dashboard_path, dashboard_url.
  fields:
    dashboard_path:
      required: false
      selector:
        text:
      description: >-
        Optional absolute file path where the dashboard YAML should be written.
        When omitted, the file is written to <config>/hsem_dashboard.yaml.
