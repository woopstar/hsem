# HSEM Home Assistant Integration Quality Scale
#
# This file tracks the integration's status against the Home Assistant quality
# scale rules (https://developers.home-assistant.io/docs/core/integration-quality-scale/).
#
# HSEM is a custom integration. The tier declared in manifest.json is the lowest
# tier for which every required rule is satisfied. Rules above the declared tier
# are recorded here for transparency, but they are not claimed as complete unless
# they are genuinely met.
#
# Status values:
#   done   - the rule is satisfied.
#   todo   - the rule is not yet satisfied.
#   exempt - the rule does not apply to HSEM; a comment explains why.

rules:
  # ---------------------------------------------------------------------------
  # Bronze — all required for the declared Bronze tier
  # ---------------------------------------------------------------------------
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done
  dependency-transparency: done
  docs-actions: done
  docs-conditions:
    status: exempt
    comment: HSEM does not provide any conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: HSEM does not provide any triggers.
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # ---------------------------------------------------------------------------
  # Silver — gaps are filed as separate issues and linked from issue #1038
  # ---------------------------------------------------------------------------
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable:
    status: todo
    comment: >-
      No single "unavailable / back online" log transition for input entities.
      Missing-entity state is surfaced via sensor.hsem_missing_entities but not
      logged once per transition. Tracked in issue #1045.
  parallel-updates:
    status: todo
    comment: >-
      PARALLEL_UPDATES is not set on any HSEM platform. Tracked in issue #1043.
  reauthentication-flow:
    status: todo
    comment: >-
      HSEM has no async_step_reauth. A missing or incompatible Huawei Solar
      dependency is caught at setup, but there is no UI re-authentication flow.
      Tracked in issue #1044.
  test-coverage:
    status: todo
    comment: >-
      Overall test coverage is ~87 %, below the 95 % Silver threshold. Tracked
      in issue #1046.

  # ---------------------------------------------------------------------------
  # Gold — not audited for the Bronze declaration; kept as todo
  # ---------------------------------------------------------------------------
  devices:
    status: todo
    comment: Not audited against Gold for this Bronze declaration.
  diagnostics:
    status: todo
    comment: Not audited against Gold for this Bronze declaration.
  discovery:
    status: exempt
    comment: Custom integrations are installed manually or via HACS, not discovered by HA.
  discovery-update-info:
    status: exempt
    comment: Custom integrations are installed manually or via HACS, not discovered by HA.
  docs-data-update:
    status: todo
    comment: Not audited against Gold for this Bronze declaration.
  docs-examples:
    status: todo
    comment: Not audited against Gold for this Bronze declaration.
  docs-known-limitations:
    status: todo
    comment: Not audited against Gold for this Bronze declaration.
  docs-supported-devices:
    status: todo
    comment: Not audited against Gold for this Bronze declaration.
  docs-supported-functions:
    status: todo
    comment: Not audited against Gold for this Bronze declaration.
  docs-troubleshooting:
    status: todo
    comment: Not audited against Gold for this Bronze declaration.
  docs-use-cases:
    status: todo
    comment: Not audited against Gold for this Bronze declaration.
  dynamic-devices:
    status: exempt
    comment: HSEM creates a fixed set of seven devices per config entry.
  entity-category:
    status: todo
    comment: Not audited against Gold for this Bronze declaration.
  entity-device-class:
    status: todo
    comment: Not audited against Gold for this Bronze declaration.
  entity-disabled-by-default:
    status: exempt
    comment: HSEM does not currently disable any entities by default.
  entity-translations:
    status: todo
    comment: Not audited against Gold for this Bronze declaration.
  exception-translations:
    status: todo
    comment: Not audited against Gold for this Bronze declaration.
  icon-translations:
    status: exempt
    comment: HSEM uses static _attr_icon values; icon translations are not used.
  reconfiguration-flow:
    status: todo
    comment: Not audited against Gold for this Bronze declaration.
  repair-issues:
    status: todo
    comment: Not audited against Gold for this Bronze declaration.
  stale-devices:
    status: exempt
    comment: HSEM creates a fixed set of seven devices per config entry.

  # ---------------------------------------------------------------------------
  # Platinum — not audited for the Bronze declaration; kept as todo
  # ---------------------------------------------------------------------------
  async-dependency:
    status: exempt
    comment: HSEM interacts with HA entities, not an external async device library.
  inject-websession:
    status: exempt
    comment: HSEM does not make direct HTTP requests that would use a shared websession.
  strict-typing:
    status: todo
    comment: Not audited against Platinum for this Bronze declaration.
