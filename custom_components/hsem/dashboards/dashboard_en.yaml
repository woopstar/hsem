views:
  - title: HSEM
    type: sections
    max_columns: 2
    cards: []
    badges: []
    sections:
      - type: grid
        cards:
          - type: heading
            heading: HSEM Status & Control
            heading_style: title
            grid_options:
              columns: full
              rows: 2
          - type: tile
            entity: sensor.hsem_workingmode_sensor
            name: Working Mode
            icon: mdi:robot
            color: state
            grid_options:
              columns: 2
          - type: tile
            entity: sensor.hsem_degraded_mode_sensor
            name: System Health
            icon: mdi:heart-pulse
            color: state
            grid_options:
              columns: 2
          - type: tile
            entity: switch.hsem_read_only
            name: Read-Only
            icon: mdi:lock
            color: state
            features:
              - type: toggle
            grid_options:
              columns: 2
          - type: tile
            entity: sensor.hsem_plan_explanation_sensor
            name: Plan Strategy
            icon: mdi:strategy
            color: state
            grid_options:
              columns: 2
          - type: tile
            entity: select.hsem_force_working_mode
            name: Force Mode
            icon: mdi:hand-back-right
            color: state
            features:
              - type: select-options
            grid_options:
              columns: 2
          - type: tile
            entity: sensor.hsem_next_update_sensor
            name: Next Update
            icon: mdi:update
            color: state
            grid_options:
              columns: 2
          - type: tile
            entity: sensor.hsem_applier_status_sensor
            name: Inverter Apply
            icon: mdi:transmission-tower
            color: state
            grid_options:
              columns: 2
          - type: tile
            entity: sensor.hsem_hardware_writes_sensor
            name: Hardware Writes
            icon: mdi:pencil-off
            color: state
            grid_options:
              columns: 2
          - type: tile
            entity: sensor.hsem_pv_curtailment_sensor
            name: PV Curtailment
            icon: mdi:solar-power
            color: state
            grid_options:
              columns: 2
      - type: grid
        cards:
          - type: heading
            heading: Financial Insights
            heading_style: title
            grid_options:
              columns: full
              rows: 2
          - type: tile
            entity: sensor.hsem_export_income
            name: Export Income
            icon: mdi:cash-plus
            color: state
            grid_options:
              columns: 2
          - type: tile
            entity: sensor.hsem_import_cost
            name: Import Cost
            icon: mdi:cash-minus
            color: state
            grid_options:
              columns: 2
          - type: tile
            entity: sensor.hsem_net_grid_balance
            name: Net Grid Balance
            icon: mdi:scale-balance
            color: state
            grid_options:
              columns: 2
          - type: tile
            entity: sensor.hsem_savings_tracker
            name: Savings Tracker
            icon: mdi:piggy-bank
            color: state
            grid_options:
              columns: 2
      - type: grid
        cards:
          - type: heading
            heading: Forecast Quality
            heading_style: title
            grid_options:
              columns: full
              rows: 2
          - type: tile
            entity: sensor.hsem_forecast_accuracy_sensor
            name: Forecast Accuracy
            icon: mdi:chart-line
            color: state
            grid_options:
              columns: 2
          - type: tile
            entity: sensor.hsem_prediction_accuracy_sensor
            name: Prediction Accuracy
            icon: mdi:target
            color: state
            grid_options:
              columns: 2
          - type: tile
            entity: sensor.hsem_solar_confidence_sensor
            name: Solar Confidence
            icon: mdi:solar-power
            color: state
            grid_options:
              columns: 2
      - type: grid
        cards:
          - type: heading
            heading: EV Charging
            heading_style: title
            grid_options:
              columns: full
              rows: 2
          - type: conditional
            conditions:
              - entity: sensor.hsem_ev_optimal_charging_plan
                state_not: unavailable
            grid_options:
              columns: 2
            card:
              type: tile
              entity: sensor.hsem_ev_optimal_charging_plan
              name: EV Plan
              icon: mdi:ev-station
              color: state
          - type: conditional
            conditions:
              - entity: sensor.hsem_ev_charging_sensor
                state_not: unavailable
            grid_options:
              columns: 2
            card:
              type: tile
              entity: sensor.hsem_ev_charging_sensor
              name: EV Charging Active
              icon: mdi:lightning-bolt
              color: state
          - type: conditional
            conditions:
              - entity: switch.hsem_ev_smart_charging
                state_not: unavailable
            grid_options:
              columns: 2
            card:
              type: tile
              entity: switch.hsem_ev_smart_charging
              name: EV Smart Charging
              icon: mdi:brain
              color: state
              features:
                - type: toggle
          - type: conditional
            conditions:
              - entity: switch.hsem_ev_force_charge_now
                state_not: unavailable
            grid_options:
              columns: 2
            card:
              type: tile
              entity: switch.hsem_ev_force_charge_now
              name: EV Force Charge
              icon: mdi:lightning-bolt-outline
              color: state
              features:
                - type: toggle
          - type: conditional
            conditions:
              - entity: number.hsem_ev_target_soc
                state_not: unavailable
            grid_options:
              columns: 2
            card:
              type: tile
              entity: number.hsem_ev_target_soc
              name: EV Target SoC
              icon: mdi:battery-charging
              color: state
          - type: conditional
            conditions:
              - entity: time.hsem_ev_deadline_time
                state_not: unavailable
            grid_options:
              columns: 2
            card:
              type: tile
              entity: time.hsem_ev_deadline_time
              name: EV Deadline
              icon: mdi:clock-end
              color: state
          - type: conditional
            conditions:
              - entity: sensor.hsem_ev_soc_economics
                state_not: unavailable
            grid_options:
              columns: full
            card:
              type: markdown
              title: EV Charging Economics
              content: >
                {% set pts = state_attr('sensor.hsem_ev_soc_economics', 'points') or [] %}
                {% for label, rows in pts | groupby('deadline_label') %}
                **{{ label }}**

                | Target SoC | Cost | +Δ vs previous | Feasible |
                | --- | --- | --- | --- |
                {% for p in rows %}
                | {{ p.target_soc_pct }}% | {{ p.total_cost }} | {{ p.delta_from_previous if p.delta_from_previous is not none else '—' }} | {{ '✅' if p.feasible else '⚠️' }} |
                {% endfor %}

                {% endfor %}
          - type: conditional
            conditions:
              - entity: sensor.hsem_ev_second_optimal_charging_plan
                state_not: unavailable
            grid_options:
              columns: 2
            card:
              type: tile
              entity: sensor.hsem_ev_second_optimal_charging_plan
              name: EV 2 Plan
              icon: mdi:ev-station
              color: state
          - type: conditional
            conditions:
              - entity: switch.hsem_ev_second_smart_charging
                state_not: unavailable
            grid_options:
              columns: 2
            card:
              type: tile
              entity: switch.hsem_ev_second_smart_charging
              name: EV 2 Smart Charging
              icon: mdi:brain
              color: state
              features:
                - type: toggle
          - type: conditional
            conditions:
              - entity: switch.hsem_ev_second_force_charge_now
                state_not: unavailable
            grid_options:
              columns: 2
            card:
              type: tile
              entity: switch.hsem_ev_second_force_charge_now
              name: EV 2 Force Charge
              icon: mdi:lightning-bolt-outline
              color: state
              features:
                - type: toggle
          - type: conditional
            conditions:
              - entity: number.hsem_ev_second_target_soc
                state_not: unavailable
            grid_options:
              columns: 2
            card:
              type: tile
              entity: number.hsem_ev_second_target_soc
              name: EV 2 Target SoC
              icon: mdi:battery-charging
              color: state
          - type: conditional
            conditions:
              - entity: time.hsem_ev_second_deadline_time
                state_not: unavailable
            grid_options:
              columns: 2
            card:
              type: tile
              entity: time.hsem_ev_second_deadline_time
              name: EV 2 Deadline
              icon: mdi:clock-end
              color: state
          - type: conditional
            conditions:
              - entity: sensor.hsem_ev_second_soc_economics
                state_not: unavailable
            grid_options:
              columns: full
            card:
              type: markdown
              title: EV 2 Charging Economics
              content: >
                {% set pts = state_attr('sensor.hsem_ev_second_soc_economics', 'points') or [] %}
                {% for label, rows in pts | groupby('deadline_label') %}
                **{{ label }}**

                | Target SoC | Cost | +Δ vs previous | Feasible |
                | --- | --- | --- | --- |
                {% for p in rows %}
                | {{ p.target_soc_pct }}% | {{ p.total_cost }} | {{ p.delta_from_previous if p.delta_from_previous is not none else '—' }} | {{ '✅' if p.feasible else '⚠️' }} |
                {% endfor %}

                {% endfor %}
      - type: grid
        cards:
          - type: heading
            heading: HSEM Working Mode Recommendation
            heading_style: title
            grid_options:
              columns: full
              rows: 2
          - type: custom:apexcharts-card
            update_interval: 5m
            experimental:
              disable_config_validation: true
            grid_options:
              columns: full
            layout_options:
              grid_columns: 3
              grid_rows: 1
            header:
              show: false
            graph_span: 48h
            span:
              start: day
            now:
              show: true
              color: red
              label: Now
            apex_config:
              chart:
                height: 120
              stroke:
                curve: stepline
              xaxis:
                labels:
                  format: HH
                  rotate: -45
                  rotateAlways: true
                  hideOverlappingLabels: true
                  style:
                    fontSize: 10
                    fontWeight: 500
              yaxis:
                show: false
                min: 0
                max: 1
                tickAmount: 1
            series:
              - name: Batteries Charge From Grid
                entity: sensor.hsem_workingmode_sensor
                attribute: hourly_recommendations
                type: area
                opacity: 1
                show:
                  legend_value: false
                data_generator: >
                  const rows =
                  (Array.isArray(entity.attributes.hourly_recommendations) ?
                  entity.attributes.hourly_recommendations : [])
                    .slice()
                    .sort((a,b) => new Date(a.start) - new Date(b.start));
                  const out = []; rows.forEach(({ start, end, recommendation })
                  => {
                    const s = new Date(start).getTime();
                    const e = new Date(end).getTime();
                    const on = recommendation === 'batteries_charge_grid' ? 1 : null;
                    out.push([s, on], [e, on]);
                  }); return out;
                color: "#ef4444"
              - name: Batteries Charge From Solar
                entity: sensor.hsem_workingmode_sensor
                attribute: hourly_recommendations
                type: area
                opacity: 1
                show:
                  legend_value: false
                data_generator: >
                  const rows =
                  (Array.isArray(entity.attributes.hourly_recommendations) ?
                  entity.attributes.hourly_recommendations : [])
                    .slice()
                    .sort((a,b) => new Date(a.start) - new Date(b.start));
                  const out = []; rows.forEach(({ start, end, recommendation })
                  => {
                    const s = new Date(start).getTime();
                    const e = new Date(end).getTime();
                    const on = recommendation === 'batteries_charge_solar' ? 1 : null;
                    out.push([s, on], [e, on]);
                  }); return out;
                color: "#22c55e"
              - name: Batteries Discharge Mode
                entity: sensor.hsem_workingmode_sensor
                attribute: hourly_recommendations
                type: area
                opacity: 1
                show:
                  legend_value: false
                data_generator: >
                  const rows =
                  (Array.isArray(entity.attributes.hourly_recommendations) ?
                  entity.attributes.hourly_recommendations : [])
                    .slice()
                    .sort((a,b) => new Date(a.start) - new Date(b.start));
                  const out = []; rows.forEach(({ start, end, recommendation })
                  => {
                    const s = new Date(start).getTime();
                    const e = new Date(end).getTime();
                    const on = recommendation === 'batteries_discharge_mode' ? 1 : null;
                    out.push([s, on], [e, on]);
                  }); return out;
                color: "#f97316"
              - name: Batteries Wait Mode
                entity: sensor.hsem_workingmode_sensor
                attribute: hourly_recommendations
                type: area
                opacity: 1
                show:
                  legend_value: false
                data_generator: >
                  const rows =
                  (Array.isArray(entity.attributes.hourly_recommendations) ?
                  entity.attributes.hourly_recommendations : [])
                    .slice()
                    .sort((a,b) => new Date(a.start) - new Date(b.start));
                  const out = []; rows.forEach(({ start, end, recommendation })
                  => {
                    const s = new Date(start).getTime();
                    const e = new Date(end).getTime();
                    const on = recommendation === 'batteries_wait_mode' ? 1 : null;
                    out.push([s, on], [e, on]);
                  }); return out;
                color: "#8b5cf6"
              - name: EV Smart Charging
                entity: sensor.hsem_workingmode_sensor
                attribute: hourly_recommendations
                type: area
                opacity: 1
                show:
                  legend_value: false
                data_generator: >
                  const rows =
                  (Array.isArray(entity.attributes.hourly_recommendations) ?
                  entity.attributes.hourly_recommendations : [])
                    .slice()
                    .sort((a,b) => new Date(a.start) - new Date(b.start));
                  const out = []; rows.forEach(({ start, end, recommendation })
                  => {
                    const s = new Date(start).getTime();
                    const e = new Date(end).getTime();
                    const on = recommendation === 'ev_smart_charging' ? 1 : null;
                    out.push([s, on], [e, on]);
                  }); return out;
                color: "#06b6d4"
              - name: Time Passed
                entity: sensor.hsem_workingmode_sensor
                attribute: hourly_recommendations
                type: area
                opacity: 1
                show:
                  legend_value: false
                data_generator: >
                  const rows =
                  (Array.isArray(entity.attributes.hourly_recommendations) ?
                  entity.attributes.hourly_recommendations : [])
                    .slice()
                    .sort((a,b) => new Date(a.start) - new Date(b.start));
                  const out = []; rows.forEach(({ start, end, recommendation })
                  => {
                    const s = new Date(start).getTime();
                    const e = new Date(end).getTime();
                    const on = recommendation === 'time_passed' ? 1 : null;
                    out.push([s, on], [e, on]);
                  }); return out;
                color: "#64748b"
              - name: Force Batteries Discharge
                entity: sensor.hsem_workingmode_sensor
                attribute: hourly_recommendations
                type: area
                opacity: 1
                show:
                  legend_value: false
                data_generator: >
                  const rows =
                  (Array.isArray(entity.attributes.hourly_recommendations) ?
                  entity.attributes.hourly_recommendations : [])
                    .slice()
                    .sort((a,b) => new Date(a.start) - new Date(b.start));
                  const out = []; rows.forEach(({ start, end, recommendation })
                  => {
                    const s = new Date(start).getTime();
                    const e = new Date(end).getTime();
                    const on = recommendation === 'force_batteries_discharge' ? 1 : null;
                    out.push([s, on], [e, on]);
                  }); return out;
                color: "#ec4899"
          - type: tile
            entity: sensor.hsem_workingmode_sensor
            features_position: bottom
            vertical: false
            grid_options:
              columns: 24
              rows: 1
          - type: heading
            heading: Battery
            heading_style: title
          - type: custom:apexcharts-card
            update_interval: 10m
            apex_config:
              chart:
                height: 150px
              legend:
                show: false
              xaxis:
                labels:
                  show: true
                  format: HH
                  rotate: -45
                  rotateAlways: true
                  hideOverlappingLabels: true
                  style:
                    fontSize: 10
                    fontWeight: 10
            header:
              show: true
              show_states: true
              colorize_states: true
            all_series_config:
              type: area
              opacity: 0.3
              stroke_width: 1
            series:
              - entity: sensor.batteries_state_of_capacity
                type: line
                color: "#eab308"
                yaxis_id: pct
                opacity: 1
                stroke_width: 2
              - entity: sensor.power_import
                color: "#ef4444"
                yaxis_id: watt
                group_by:
                  func: avg
                  duration: 5min
            yaxis:
              - id: pct
                show: true
                opposite: false
                decimals: 0
                max: 100
                min: 0
              - id: watt
                show: true
                opposite: true
                decimals: 0
                min: 0
          - type: custom:apexcharts-card
            update_interval: 5m
            header:
              show: true
              title: batteries_charged_kwh
            graph_span: 48h
            span:
              start: day
            now:
              show: true
              color: red
              label: Now
            apex_config:
              chart:
                height: 180
              stroke:
                curve: stepline
                width: 1
              markers:
                size: 0
              xaxis:
                labels:
                  format: HH
                  rotate: -45
                  rotateAlways: true
                  hideOverlappingLabels: true
                  style:
                    fontSize: 10
                    fontWeight: 500
              yaxis:
                decimalsInFloat: 3
                opposite: true
            series:
              - name: batteries_charged_kwh
                entity: sensor.hsem_workingmode_sensor
                attribute: hourly_recommendations
                type: line
                color: "#22c55e"
                float_precision: 3
                show:
                  legend_value: false
                data_generator: >
                  const rows =
                  (Array.isArray(entity.attributes.hourly_recommendations) ?
                  entity.attributes.hourly_recommendations : [])
                    .slice()
                    .sort((a,b) => new Date(a.start) - new Date(b.start));
                  const out = []; rows.forEach(({ start, end,
                  batteries_charged_kwh }) => {
                    const s = new Date(start).getTime();
                    const e = new Date(end).getTime();
                    out.push([s, batteries_charged_kwh], [e, batteries_charged_kwh]);
                  }); return out;
