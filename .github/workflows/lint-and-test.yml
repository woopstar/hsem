name: Lint and Test

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  quality:
    name: Quality gates (devcontainer)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Create mount stubs for CI
        run: mkdir -p ~/.ssh ~/.gnupg

      - name: Run all quality gates
        uses: devcontainers/ci@v0.3
        with:
          runCmd: |
            echo "=== Lint ==="
            scripts/quality lint
            echo ""
            echo "=== Type Check ==="
            scripts/quality typing
            echo ""
            echo "=== Quality ==="
            scripts/quality quality
            echo ""
            echo "=== Tests ==="
            scripts/quality test || true

      - name: Verify tests passed
        run: |
          if [ ! -f coverage.xml ]; then
            echo "Tests failed — no coverage report generated"
            exit 1
          fi
          FAILURES=$(grep -oP 'failures="\K\d+' test-results.xml || echo "1")
          ERRORS=$(grep -oP 'errors="\K\d+' test-results.xml || echo "1")
          if [ "$FAILURES" != "0" ] || [ "$ERRORS" != "0" ]; then
            echo "Tests had failures=$FAILURES errors=$ERRORS"
            exit 1
          fi
          echo "All tests passed (failures=$FAILURES errors=$ERRORS)"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: ./coverage.xml
          retention-days: 1

  codecov:
    name: Upload coverage to Codecov
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v8
        with:
          name: coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella