name: Dependabot Auto-Approve and Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, labeled]

permissions:
  pull-requests: write
  contents: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && github.event.action != 'labeled'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      # Approve all Dependabot PRs so held workflow runs are released and CI executes.
      - name: Approve PR
        run: gh pr review "$PR_URL" --approve --body "Auto-approved by dependabot-auto workflow; CI will validate this change."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Auto-merge patch/minor only — majors get approved but wait for a human.
      - name: Enable auto-merge (patch & minor)
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Flag major update for manual review
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr edit "$PR_URL" --add-label "dependencies:major"
          gh pr comment "$PR_URL" --body ":warning: Major version bump — auto-merge skipped. Please review the changelog and breaking changes before merging."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Dependabot adds `major` or `minor` to its PRs by itself when labels with
  # those names exist. Release Drafter reads them as the bump for HSEM's own
  # version, so a major update of a dependency drafted a major HSEM release.
  # A dependency update is a patch release: `patch` comes from dependabot.yml.
  release-labels:
    name: Drop release-bump labels
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      (contains(github.event.pull_request.labels.*.name, 'major') ||
       contains(github.event.pull_request.labels.*.name, 'minor'))
    steps:
      - name: Remove major and minor
        run: |
          for label in major minor; do
            if [[ ",${LABELS}," == *",${label},"* ]]; then
              gh pr edit "$PR_URL" --remove-label "${label}"
            fi
          done
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
