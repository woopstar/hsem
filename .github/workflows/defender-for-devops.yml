# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
#
# Microsoft Security DevOps (MSDO) is a command line application which integrates static analysis tools into the development cycle.
# MSDO installs, configures and runs the latest versions of static analysis tools
# (including, but not limited to, SDL/security and compliance tools).
#
# The action supports both windows-latest and ubuntu-latest. This workflow runs on Linux: MSDO
# passes every Python file to bandit on one command line, and on Windows that line is capped at
# 32,767 characters. The repository outgrew it (issue #1211), so bandit failed to start and the
# job went red with zero findings. Linux has no comparable limit. The trade-off is the AntiMalware
# tool, which is Windows-only and no longer runs.
#
# For more information about the action , check out https://github.com/microsoft/security-devops-action
#
# Please note this workflow do not integrate your GitHub Org with Microsoft Defender For DevOps. You have to create an integration
# and provide permission before this can report data back to azure.
# Read the official documentation here : https://learn.microsoft.com/en-us/azure/defender-for-cloud/quickstart-onboard-github

name: "Microsoft Defender For Devops"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "30 03 * * *"

permissions:
  contents: read

jobs:
  MSDO:
    # Linux, not Windows: see the note on the command-line limit above (issue #1211).
    runs-on: ubuntu-latest
    # Fork PRs run with a read-only token; this job writes security results.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run Microsoft Security DevOps
        uses: microsoft/security-devops-action@v1.12.0
        id: msdo
      - name: Upload results to Security tab
        uses: github/codeql-action/upload-sarif@v4.38.2
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}
