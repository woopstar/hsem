# Label names used below must exist in .github/sync-labels.yml, the
# canonical label manifest.

name: Auto Label PRs from Conventional Commits

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  label:
    name: Assign PR Labels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: github.event.pull_request.merged == false
    steps:
      - name: Execute assign labels
        id: action-assign-labels
        uses: mauroalderete/action-assign-labels@671a4ca2da0f900464c58b8b5540a1e07133e915
        with:
          pull-request-number: ${{ github.event.pull_request.number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          conventional-commits: |
            conventional-commits:
              - type: 'fix'
                nouns: ['FIX', 'Fix', 'fix', 'FIXED', 'Fixed', 'fixed']
                labels: ['bug']
              - type: 'feature'
                nouns: ['FEATURE', 'Feature', 'feature', 'FEAT', 'Feat', 'feat']
                labels: ['enhancement']
              - type: 'breaking_change'
                nouns: ['BREAKING CHANGE', 'BREAKING', 'MAJOR']
                labels: ['breaking-change']
              - type: 'documentation'
                nouns: ['doc','docu','document','documentation']
                labels: ['documentation']
              - type: 'build'
                nouns: ['build','rebuild']
                labels: ['build']
              - type: 'config'
                nouns: ['config', 'conf', 'cofiguration', 'configure']
                labels: ['config']
              - type: 'chore'
                nouns: ['chore', 'Chore', 'CHORE']
                labels: ['chore']
              - type: 'dependencies'
                nouns: ['deps', 'dep', 'dependencies', 'dependency']
                labels: ['dependencies']
              - type: 'refactor'
                nouns: ['refactor', 'Refactor', 'REFACTOR']
                labels: ['area:refactor']
              - type: 'perf'
                nouns: ['perf', 'Perf', 'PERF', 'performance']
                labels: ['performance']
              - type: 'test'
                nouns: ['test', 'Test', 'TEST', 'tests']
                labels: ['area:tests']
              - type: 'ci'
                nouns: ['ci', 'CI']
                labels: ['build']
          maintain-labels-not-matched: false
          apply-changes: true
